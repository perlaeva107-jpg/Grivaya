<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSP Chat UI - Empty View</title>
    <link rel="stylesheet" href="css/message.css">
</head>
<body>

    <div class="psp-screen">
        <header class="chat-header">
            <span class="user-name">Rivay</span>
        </header>

        <div class="message-container">
            </div>

        <div class="input-area">
            <input type="text" placeholder="Type Message..." class="message-input">
            <button class="send-button">
                <svg viewBox="0 0 24 24" fill="white" width="24px" height="24px">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
    </div>

</body>
</html>
